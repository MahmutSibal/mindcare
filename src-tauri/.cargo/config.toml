# OpenSSL'in derleme araçları (perl/nmake) ASCII olmayan yollarda başarısız oluyor.
# Projeyi yalnızca ASCII karakter içeren bir klasörde tutun (ör. C:\Users\<ad>\pskoloji\mindcare-desktop).
# Makineye özel target-dir burada tanımlanmaz; gerekirse CARGO_TARGET_DIR ortam değişkeni kullanılır.

[env]
# Strawberry Perl, OpenSSL'i kaynaktan derlemek için gerekli.
PERL = "C:/Strawberry/perl/bin/perl.exe"

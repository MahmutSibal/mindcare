[package]
name = "mindcare"
version = "1.0.4"
description = "Mavi Ruh - Seans ve Danisan Yonetim Sistemi"
authors = ["Mavi Ruh"]
edition = "2024"

[lib]
# The `_lib` suffix is needed on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mindcare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLCipher derlenerek pakete gömülür (libtomcrypt kripto sağlayıcısı; OpenSSL gerekmez).
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
rand = "0.8"
hex = "0.4"
# Kurtarma anahtarının sağlaması (bağımlılık ağacında zaten mevcut).
sha2 = "0.10"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
# Cloudflare TURN'den geçici kimlik bilgisi almak için (Tauri'nin zaten kullandığı sürüm;
# Windows'ta native-tls, işletim sisteminin TLS katmanını kullanır, OpenSSL gerektirmez).
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
thiserror = "2"

# Anahtar, işletim sisteminin güvenli deposunda tutulur (Windows Credential Manager vb.).
# Android'de bu depo yoktur; orada anahtar uygulamaya özel dizinde saklanır (bkz. keystore.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
